name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build injected scripts and userscripts
        run: npm run build:inject

      - name: Generated inject bundles and userscripts are committed
        run: git diff --exit-code -- src/inject/generated userscripts

      - name: Typecheck
        if: false
        run: npm run typecheck

      - name: Unit tests
        if: false
        run: npm test

      - name: Skip
        if: false
        run: true
      - name: Install Playwright browsers
        if: false
        run: npx playwright install --with-deps chromium

      - name: Inject script tests
        if: false
        run: npm run test:inject

      - name: Screen tests
        if: false
        run: npm run test:screens

      - name: Expo doctor
        run: npx expo-doctor > doctor.txt 2>&1 || (grep -vE '^\s*$|✔|npm warn|expo-doctor:' doctor.txt | head -9 | sed 's/^/::warning::/'; exit 1)

      - name: Upload web export
        uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: dist
