<!doctype html>
<!-- Home page shaped the way the feed leaked through on 23 Oct 2026: the
     stories tray and the feed share one wrapper (so "everything after the
     first child" hides nothing) and posts are plain divs, not articles.
     The stories button must show the tray and nothing of the feed. Class
     names are fake hashes. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Instagram</title>
  </head>
  <body>
    <main class="x78zum5 hashed-main" role="main">
      <div class="x9f619 hashed-wrap">
        <div class="x1n2onr6 hashed-tray-scroller">
          <ul class="x6s0dn4 hashed-tray">
            <li><div role="button" aria-label="Your story" class="x1i10hfl">You</div></li>
            <li><div role="button" aria-label="Story by alice, not seen" class="x1i10hfl">alice</div></li>
            <li><div role="button" aria-label="Story by bob, seen" class="x1i10hfl">bob</div></li>
          </ul>
        </div>
        <div class="xh8yej3 hashed-feed">
          <div class="x1lliihq hashed-post feed-post">Feed post one</div>
          <div class="x1lliihq hashed-post feed-post">Feed post two</div>
          <video class="feed-video" src="/clip.mp4"></video>
        </div>
      </div>
    </main>
  </body>
</html>
