<!doctype html>
<!-- LinkedIn notifications fixture (checked against the live site on 21 Nov
     2026): each notification links to the feed with the post id in the
     query. Class names are fake hashes. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Notifications | LinkedIn</title>
  </head>
  <body>
    <main class="nt-list Qz8fJa">
      <article class="nt-card hwQ2lz">
        <a class="nt-card__link dsK8fJe" id="liked" href="https://www.linkedin.com/feed/?highlightedUpdateUrn=urn%3Ali%3Aactivity%3A7390000000000000001&amp;highlightedUpdateType=REACTION&amp;showCommentBox=false">Ada and 3 others liked your post</a>
      </article>
      <article class="nt-card hwQ2lz">
        <a class="nt-card__link dsK8fJe" id="commented" href="/feed/?highlightedUpdateUrn=urn:li:ugcPost:55&amp;showCommentBox=true">Grace commented on your post</a>

      <article class="nt-card hwQ2lz">
        <a class="nt-card__link dsK8fJe" id="profile" href="https://www.linkedin.com/in/ada-lovelace/">Ada viewed your profile</a>
      </article>
      <a class="dsK8fJe" id="plainfeed" href="/feed/">Home</a>
    </main>
  </body>
</html>
